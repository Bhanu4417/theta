[package]
name = "theta"
version = "0.1.10"
edition = "2021"
# Floor imposed by dependencies (darling/icu via syntect declare 1.88).
rust-version = "1.88"
description = "Theta — a multi-session tiled terminal workspace for coding agents"
license = "MIT"
repository = "https://github.com/Bhanu4417/theta"
homepage = "https://github.com/Bhanu4417/theta"
readme = "README.md"
keywords = ["tui", "agent", "coding-agent", "cli", "ai"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["/.github", "/assets"]

[dependencies]
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
tokio = { version = "1", features = ["full"] }
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dirs = "5"
anyhow = "1"
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
ignore = "0.4"

[profile.release]
lto = "thin"
strip = true

# Lints are scoped to this crate rather than set via RUSTFLAGS, so a warning
# from a dependency cannot fail our build. CI runs clippy --all-targets, which
# also covers test code.
[lints.rust]
warnings = "deny"

[lints.clippy]
all = "deny"
