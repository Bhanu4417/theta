name: CI

on:
  push:
    branches: [main]
  pull_request:

# Lints are denied in Cargo.toml ([lints]), scoped to this crate. Setting
# RUSTFLAGS=-D warnings here would also fail the build on a dependency's
# warnings, which we do not control.
env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build · test · lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked

      - name: Test
        run: cargo test --locked

      - name: Clippy
        run: cargo clippy --all-targets

  installer-unix:
    name: install.sh
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      # Serves a release from an in-process server and runs the real installer
      # against it: happy path, tampered checksum, missing release, corrupt
      # archive, flags, re-install.
      - name: Test install.sh
        run: python3 packaging/installer-tests/run.py --installer sh

  installer-windows:
    name: install.ps1
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - name: Test install.ps1
        run: python packaging/installer-tests/run.py --installer ps1
