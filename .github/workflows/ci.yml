name: CI

on:
  push:
    branches: [main]
  pull_request:

# Lints are denied in Cargo.toml ([lints]), scoped to this crate. Setting
# RUSTFLAGS=-D warnings here would also fail the build on a dependency's
# warnings, which we do not control.
env:
  CARGO_TERM_COLOR: always

jobs:
  # Every platform, on every push. Actions minutes are free on a public
  # repository, so cross-platform coverage costs nothing — it was gated on a tag
  # only while this repository was private and minutes were billed with a
  # per-runner multiplier (Linux 1x, Windows 2x, macOS 10x).
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked

      - name: Test
        run: cargo test --locked

      - name: Clippy
        if: matrix.os == 'ubuntu-latest'
        run: cargo clippy --all-targets --locked

      # The installers are the first thing a user runs, so they are exercised
      # rather than trusted. install.ps1 runs under pwsh, which every runner
      # has, alongside the sh installer.
      - name: Installer harnesses
        if: matrix.os == 'ubuntu-latest'
        run: |
          python3 packaging/installer-tests/run.py --installer sh
          python3 packaging/installer-tests/run.py --installer ps1
