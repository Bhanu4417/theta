name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and attach artifacts to"
        required: true

permissions:
  contents: write

# Two releases for the same tag would race on the upload.
concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  BIN: theta

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          # macos-14 is deprecated and macos-13 has been retired, so the Intel
          # build must use a label that still exists or it never runs.
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      # Runs before anything that can fail, and writes to the run summary, so
      # the values are visible even when the job log is not retrievable from
      # GitHub — which is what made an earlier failure here undiagnosable.
      - name: Diagnose
        shell: bash
        run: |
          set -uo pipefail
          {
            echo "### ${{ matrix.target }}"
            echo
            echo "| value | result |"
            echo "| --- | --- |"
            echo "| event | ${{ github.event_name }} |"
            echo "| ref | ${{ github.ref }} |"
            echo "| ref_name | ${{ github.ref_name }} |"
            echo "| inputs.tag | ${{ github.event.inputs.tag }} |"
            echo "| sha | ${{ github.sha }} |"
            echo "| manifest | $(grep -m1 '^version' Cargo.toml 2>/dev/null || echo MISSING) |"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Resolve the tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          # A dispatch with no tag input falls back to the branch name, which is
          # not a version; fail with that stated rather than a confusing
          # mismatch two steps later.
          case "$tag" in
            v[0-9]*) ;;
            *) echo "::error::not a version tag: '$tag' (pass tag=vX.Y.Z)"; exit 1 ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          # The version baked into the binary must match the tag, so the
          # installers and `--version` can never disagree.
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "resolved tag=$tag version=${tag#v}"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Check the tag matches Cargo.toml
        shell: bash
        run: |
          set -euo pipefail
          manifest=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"(.*)".*/\1/')
          tag_version="${{ steps.tag.outputs.version }}"
          echo "tag=${{ steps.tag.outputs.tag }} version=$tag_version manifest=$manifest"
          echo "| tag version | \`$tag_version\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| manifest | \`$manifest\` |" >> "$GITHUB_STEP_SUMMARY"
          if [ -z "$tag_version" ]; then
            echo "::error::the tag step produced no version; check its output"
            exit 1
          fi
          if [ "$manifest" != "$tag_version" ]; then
            echo "::error::tag says $tag_version but Cargo.toml says $manifest"
            exit 1
          fi

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          name="$BIN-${{ matrix.target }}"
          mkdir -p dist
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp "target/${{ matrix.target }}/release/$BIN.exe" "dist/$BIN.exe"
            (cd dist && 7z a -tzip "../$name.zip" "$BIN.exe" >/dev/null)
            echo "asset=$name.zip" >> "$GITHUB_ENV"
          else
            cp "target/${{ matrix.target }}/release/$BIN" "dist/$BIN"
            chmod +x "dist/$BIN"
            (cd dist && tar czf "../$name.tar.gz" "$BIN")
            echo "asset=$name.tar.gz" >> "$GITHUB_ENV"
          fi

      - name: Checksum
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.os }}" in
            windows-*) sha256sum "${{ env.asset }}" > "${{ env.asset }}.sha256" ;;
            *)         shasum -a 256 "${{ env.asset }}" > "${{ env.asset }}.sha256" ;;
          esac
          cat "${{ env.asset }}.sha256"

      # The installers verify this archive by hash, so a failed build must not
      # reach the release page.
      - name: Smoke-test the binary
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            ./dist/$BIN.exe --version
          else
            ./dist/$BIN --version
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.asset }}
          path: |
            ${{ env.asset }}
            ${{ env.asset }}.sha256
          if-no-files-found: error

  release:
    name: publish
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # Everything below reports what it sees. A previous run failed here and
      # its log was unavailable from GitHub, which left the cause unknowable;
      # the summary is written to the run page so a failure is diagnosable even
      # when the log blob is not.
      - name: Inspect the artifacts
        run: |
          set -euo pipefail
          {
            echo "## Release artifacts"
            echo
            echo '```'
            find artifacts -type f | sort
            echo '```'
            echo
            echo "gh: $(gh --version | head -1)"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::group::artifact tree"
          find artifacts -type f | sort
          echo "::endgroup::"
          count=$(find artifacts -type f -name 'theta-*' ! -name '*.sha256' | wc -l)
          echo "platforms: $count"
          if [ "$count" -eq 0 ]; then
            echo "::error::no artifacts were downloaded; the build jobs produced nothing"
            exit 1
          fi

      - name: Checksums file
        run: |
          set -euo pipefail
          cd artifacts
          # Combined manifest, so an installer can fetch one file. Normalize the
          # hash separator: some tools emit `hash *name`.
          cat *.sha256 | sed 's/[*]/ /' | sort -k2 > ../SHA256SUMS
          echo "::group::SHA256SUMS"
          cat ../SHA256SUMS
          echo "::endgroup::"

      - name: Resolve the tag
        id: tag
        run: |
          set -euo pipefail
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "publishing $tag"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          # `gh` verbs are retried: a release upload is a network operation
          # against GitHub and a transient 5xx should not fail a build that
          # succeeded on all five platforms.
          retry() {
            local n=1
            until "$@"; do
              if [ "$n" -ge 4 ]; then
                echo "::error::$* failed after $n attempts"
                return 1
              fi
              local back=$((n * 5))
              echo "attempt $n failed; retrying in ${back}s: $*"
              sleep "$back"
              n=$((n + 1))
            done
          }

          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "creating release $TAG"
            retry gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" \
              --generate-notes
          else
            echo "release $TAG already exists; uploading to it"
          fi

          # --clobber makes this idempotent, so a re-run repairs a partial upload
          # instead of failing on an asset that is already there.
          retry gh release upload "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            artifacts/* SHA256SUMS --clobber

          echo "### Published $TAG" >> "$GITHUB_STEP_SUMMARY"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets[] | "\(.name)  \(.size) bytes"' \
            >> "$GITHUB_STEP_SUMMARY"
